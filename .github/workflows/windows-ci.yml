name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build tests
        run: cmake --build build --config Debug --target PeakGuardAudioTests

      - name: Run tests
        run: .\build\tools\PeakGuardAudioTests\Debug\PeakGuardAudioTests.exe

      - name: Build tray app
        run: cmake --build build --config Release --target PeakGuardTray

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: .\scripts\Build-Installer.ps1 -Version 1.0.0 -Configuration Release

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeakGuardSetup
          path: out/PeakGuardSetup-1.0.0.exe
